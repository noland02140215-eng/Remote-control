<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xbox Web BLE Controller</title>
  <style>
    /* Dark Futuristic Gaming Theme */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Status Bar */
    .status-panel {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 400px;
    }

    #connectBtn {
      background-color: #107c11; /* Xbox Green */
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 124, 17, 0.4);
      transition: transform 0.1s, background-color 0.2s;
      width: 100%;
    }

    #connectBtn:active {
      transform: scale(0.98);
      background-color: #0e6b0f;
    }

    #statusLog {
      font-size: 13px;
      color: #aaaaaa;
      margin-top: 8px;
      background: #1e1e1e;
      padding: 8px;
      border-radius: 5px;
      min-height: 20px;
    }

    /* Virtual Xbox Controller Shell */
    .controller-shell {
      background: linear-gradient(145px, #2a2a2a, #1a1a1a);
      width: 90vw;
      max-width: 480px;
      height: 280px;
      border-radius: 80px 80px 120px 120px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      position: relative;
      padding: 20px;
      border: 2px solid #333;
      box-sizing: border-box;
    }

    /* Center Xbox Guide Button */
    .xbox-logo {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 45px;
      background: radial-gradient(circle, #ffffff 40%, #cccccc 80%);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .xbox-logo::after {
      content: 'X';
      color: #121212;
      font-weight: 900;
      font-size: 22px;
    }

    /* Left Side: D-PAD (Directional Arrows) */
    .left-zone {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .dpad-btn {
      position: absolute;
      background-color: #262626;
      border: 1px solid #3d3d3d;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .dpad-btn:active {
      background-color: #107c11 !important; /* Turns Green on Press */
    }

    .dpad-up    { top: 0; left: 40px; width: 40px; height: 45px; border-radius: 5px 5px 0 0; }
    .dpad-down  { bottom: 0; left: 40px; width: 40px; height: 45px; border-radius: 0 0 5px 5px; }
    .dpad-left  { top: 40px; left: 0; width: 45px; height: 40px; border-radius: 5px 0 0 5px; }
    .dpad-right { top: 40px; right: 0; width: 45px; height: 40px; border-radius: 0 5px 5px 0; }
    
    /* Center core of Dpad to make it solid */
    .dpad-center {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 40px;
      height: 40px;
      background-color: #262626;
      z-index: 1;
    }

    /* Right Side: XYBA Action Buttons */
    .right-zone {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .action-buttons {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .btn-action {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      font-weight: bold;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .btn-action:active { transform: scale(0.9); opacity: 0.8; }

    /* Exact Xbox Button Styling */
    .btn-y { top: 0; left: 42px; background-color: #fdb813; text-shadow: 0 1px 2px #000; } /* Yellow Y */
    .btn-a { bottom: 0; left: 42px; background-color: #107c11; text-shadow: 0 1px 2px #000; } /* Green A */
    .btn-x { top: 42px; left: 0; background-color: #0078d4; text-shadow: 0 1px 2px #000; } /* Blue X */
    .btn-b { top: 42px; right: 0; background-color: #e81123; text-shadow: 0 1px 2px #000; } /* Red B */
  </style>
</head>
<body>

  <div class="status-panel">
    <button id="connectBtn">🎮 Connect Xbox BLE Controller</button>
    <div id="statusLog">[System] Awaiting Web Bluetooth connection...</div>
  </div>

  <!-- Controller Interface -->
  <div class="controller-shell">
    <div class="xbox-logo"></div>

    <!-- Directional Commands -->
    <div class="left-zone">
      <div class="dpad">
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-up" data-command="UP">▲</button>
        <button class="dpad-btn dpad-left" data-command="LEFT">◀</button>
        <button class="dpad-btn dpad-right" data-command="RIGHT">▶</button>
        <button class="dpad-btn dpad-down" data-command="DOWN">▼</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="right-zone">
      <div class="action-buttons">
        <button class="btn-action btn-y" data-command="Y">Y</button>
        <button class="btn-action btn-x" data-command="X">X</button>
        <button class="btn-action btn-b" data-command="B">B</button>
        <button class="btn-action btn-a" data-command="A">A</button>
      </div>
    </div>
  </div>

  <script>
    // Bluetooth Setup Variables
    let bleDevice = null;
    let bleCharacteristic = null;

    // 💡 CUSTOMIZE YOUR HARDWARE UUIDS HERE:
    // If you use a custom ESP32/Arduino, replace these with your service/characteristic UUIDs
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb'; 
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    const connectBtn = document.getElementById('connectBtn');
    const statusLog = document.getElementById('statusLog');

    // Handle Connection Button Click
    connectBtn.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        statusLog.innerText = "Error: This browser or device blocks Web BLE entirely.";
        return;
      }

      try {
        statusLog.innerText = "Opening Bluetooth scanner...";
        
        // Scan for BLE Peripherals
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        statusLog.innerText = `Connecting to: ${bleDevice.name || 'Unnamed Device'}...`;
        
        // Connect to GATT Server
        const server = await bleDevice.gatt.connect();
        
        // Get the requested Service
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        // Get the Characteristic we can write to
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        statusLog.innerText = "🎮 Connected Successfully! Controller Ready.";
        connectBtn.style.backgroundColor = "#262626";
        connectBtn.innerText = "✓ Controller Connected";

      } catch (error) {
        console.error(error);
        statusLog.innerText = `Connection Failed: ${error.message}`;
      }
    });

    // Helper Function to Send Commands Over Bluetooth
    async function sendCommand(commandText) {
      if (!bleCharacteristic) {
        statusLog.innerText = `Pressed ${commandText} (Not connected to hardware)`;
        return;
      }

      try {
        // Encodes your text command (like "UP", "A") into raw bytes to send to your motor/receiver
        const encoder = new TextEncoder();
        const data = encoder.encode(commandText + '\n'); 
        await bleCharacteristic.writeValue(data);
        statusLog.innerText = `Sent Command: ${commandText}`;
      } catch (error) {
        statusLog.innerText = `Tx Error: ${error.message}`;
      }
    }

    // Attach Click Events to Every Single Button on the Controller
    document.querySelectorAll('.dpad-btn, .btn-action').forEach(button => {
      button.addEventListener('click', () => {
        const command = button.getAttribute('data-command');
        sendCommand(command);
      });
    });
  </script>
</body>
</html>
